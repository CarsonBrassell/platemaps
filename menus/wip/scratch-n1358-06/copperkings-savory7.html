might as well save on airfare and smash some Aloha\nVibes at home.\n","image":"https://storage.googleapis.com/savory7/copper-kings/c30c9f41-7b16-48be-82f1-1ad99406d017.jpg","speedMenu":false,"disabled":true,"availability":{"online":true,"qr":true,"pos":true,"kiosk":true,"packaging":"DINE_IN"},"routingRules":["4"]},{"id":"172","price":950,"nonTaxable":false,"name":"Graves House","description":"West Coast IPA, 6.8%\nSouth O Brewing | Oceanside, CA\n\nSouth O’s flagship West Coast IPA, brewed with Citra and Mosaic hops for bright notes of\npeach, apricot, citrus, and pine. Crisp, balanced, and smooth-drinking with a clean finish\nthat keeps you coming back for another sip","image":"https://storage.googleapis.com/savory7/copper-kings/42a64caa-9670-4d06-b85a-71ad5c6d5e5c.png","speedMenu":false,"disabled":true,"availability":{"online":false,"qr":true,"pos":true,"kiosk":true,"packaging":"DINE_IN"},"routingRules":["4"]},{"id":"173","price":950,"nonTaxable":false,"name":"Milagro","description":"Dry Nitro Stout, 5.3%\nPure Project Brewing | Vista, CA\n\nMilagro is brewed with organic, shade-grown coffee sourced from Costa Rica; this coffee was\nhand-roasted in our old home town of Manuel Antonio by our friends at Café Milagro. Pair that\nwith fresh organic Tahitian vanilla beans and you get a creamy, roasty flavor profile with hints of dark chocolate.","image":"https://storage.googleapis.com/savory7/copper-kings/logo_pure_project.png","speedMenu":false,"disabled":false,"availability":{"online":false,"qr":true,"pos":true,"kiosk":true,"packaging":"DINE_IN"},"routingRules":["4"]},{"id":"174","price":950,"nonTaxable":false,"name":"By the Sea","description":"Pale Ale, 5.5%\nCarlsbad Brewing Co. | Carlsbad, CA\n\nA San Diego style Pale ale that is brewed with Citra hops. We double dry-hop this beer for a burst of melon and sweet fruit. Enjoy!","image":"https://storage.googleapis.com/savory7/copper-kings/f00ccd91-459f-4de1-bb02-20b9f3f74436.png","speedMenu":false,"disabled":true,"av
